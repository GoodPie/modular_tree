[build-system]
requires = ["scikit-build-core>=0.11", "pybind11"]
build-backend = "scikit_build_core.build"

[project]
name = "m_tree"
version = "5.5.2"
description = "Procedural 3D tree generation library"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [{ name = "MaximeHerpin" }, { name = "Brandyn Britton" }]

[project.urls]
Homepage = "https://github.com/GoodPie/modular_tree"
Issues = "https://github.com/GoodPie/modular_tree/issues"

[tool.scikit-build]
wheel.packages = []
