name: Build and Release
permissions:
  contents: read
on:
  push:
    branches: [main]
    tags: ["[0-9]*.[0-9]*.[0-9]*"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          args: "format --check"

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Bootstrap vcpkg
        run: |
          cd m_tree/dependencies/vcpkg
          ./bootstrap-vcpkg.sh
          ./vcpkg install eigen3:x64-linux

      - name: Configure and Build
        run: |
          mkdir -p m_tree/build
          cd m_tree/build
          cmake ../ -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release

      - name: Run Tests
        run: |
          cd m_tree/build
          ctest --output-on-failure -C Release

  build-wheels:
    needs: test
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      # Wheels must carry VERSION: PyPI versions can't be replaced once uploaded.
      - run: python .github/scripts/setup_addon.py --sync-only
      - uses: pypa/cibuildwheel@b3395e271a35f73dad77f21802abe9b986dfe299 # v4.3.1
        with:
          package-dir: m_tree
        env:
          # Blender 4.5/5.0 bundle Python 3.11, 5.1+ bundle 3.13. Blender 5.x has no Intel
          # macOS build, so macOS x86_64 only needs cp311 (for 4.5 LTS).
          CIBW_BUILD: >-
            cp311-manylinux_x86_64 cp311-macosx_arm64 cp311-macosx_x86_64 cp311-win_amd64
            cp313-manylinux_x86_64 cp313-macosx_arm64 cp313-win_amd64
          # macos-latest is arm64; without this x86_64 wheels are silently skipped (#34).
          CIBW_ARCHS_MACOS: "x86_64 arm64"
          MACOSX_DEPLOYMENT_TARGET: "11.0"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_BEFORE_BUILD_LINUX: >
            dnf install -y zip unzip tar curl &&
            cd {package}/dependencies/vcpkg &&
            ./bootstrap-vcpkg.sh &&
            ./vcpkg install eigen3:x64-linux
          CIBW_BEFORE_BUILD_MACOS: >
            cd {package}/dependencies/vcpkg &&
            ./bootstrap-vcpkg.sh &&
            ./vcpkg install eigen3:arm64-osx eigen3:x64-osx
          CIBW_BEFORE_BUILD_WINDOWS: >
            cd /d {package}\dependencies\vcpkg &&
            bootstrap-vcpkg.bat &&
            vcpkg install eigen3:x64-windows
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  test-python:
    needs: build-wheels
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels-ubuntu-latest
          path: wheels
      - name: Install wheel and test dependencies
        run: |
          uv venv --python ${{ matrix.python-version }}
          PYTHON_TAG="cp$(echo ${{ matrix.python-version }} | tr -d '.')"
          uv pip install wheels/*${PYTHON_TAG}*.whl
          uv pip install pytest
      - name: Run Python tests
        run: uv run pytest tests/unit -v

  package-addon:
    needs: [build-wheels, test-python]
    runs-on: ubuntu-latest
    env:
      # Only used to run `extension build --split-platforms`; it doesn't limit which
      # Blender versions can install the zips.
      BLENDER_VERSION: "5.2.2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          path: wheels
          merge-multiple: true
      - name: Display downloaded wheels
        run: ls -la wheels/
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/blender.tar.xz
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64
      - name: Install Blender
        run: |
          [ -f ~/blender.tar.xz ] || curl -fsSL -o ~/blender.tar.xz "https://download.blender.org/release/Blender${BLENDER_VERSION%.*}/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          mkdir -p ~/blender && tar -xJf ~/blender.tar.xz -C ~/blender
          echo "$HOME/blender/blender-${BLENDER_VERSION}-linux-x64" >> "$GITHUB_PATH"
      - name: Prepare addon directory
        run: python .github/scripts/setup_addon.py --no-zip
      - name: Build extension with split platforms
        run: |
          VERSION=$(cat VERSION)
          ADDON_ROOT="tmp/modular_tree_${VERSION}/modular_tree"
          cd "$ADDON_ROOT"
          blender --command extension build --split-platforms --output-dir ../../
      - name: Display built extensions
        run: ls -la tmp/*.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: modular_tree_extension
          path: tmp/*.zip

  blender-smoke:
    needs: package-addon
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported LTS and the current LTS. Add 5.3 once it is released.
        blender: ["4.5.14", "5.2.2"]
    runs-on: ubuntu-latest
    env:
      BLENDER_VERSION: ${{ matrix.blender }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/blender.tar.xz
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64
      - name: Install Blender
        run: |
          [ -f ~/blender.tar.xz ] || curl -fsSL -o ~/blender.tar.xz "https://download.blender.org/release/Blender${BLENDER_VERSION%.*}/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          mkdir -p ~/blender && tar -xJf ~/blender.tar.xz -C ~/blender
          echo "$HOME/blender/blender-${BLENDER_VERSION}-linux-x64" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: modular_tree_extension
          path: dist
      - name: Install the extension and run the smoke test
        run: |
          export BLENDER_USER_RESOURCES="$RUNNER_TEMP/blender-user"
          blender --command extension install-file -r user_default dist/*-linux_x64.zip
          blender -b --factory-startup --python-exit-code 1 --python tests/blender/smoke.py

  publish-pypi:
    needs: [test-python, blender-smoke]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the tag matches VERSION
        run: test "$GITHUB_REF_NAME" = "$(tr _ . < VERSION)"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true

  release:
    needs: publish-pypi
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: modular_tree_extension
          path: release
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: release/*.zip
          name: Release V${{ github.ref_name }}
          body: V${{ github.ref_name }}

  deploy:
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: modular_tree_extension
          path: extensions
      - name: Upload to Blender Extensions
        env:
          BLENDER_EXTENSIONS_TOKEN: ${{ secrets.BLENDER_EXTENSIONS_TOKEN }}
        run: |
          for zip in extensions/*.zip; do
            echo "Uploading $(basename "$zip")..."
            curl -X POST \
              "https://extensions.blender.org/api/v1/extensions/modular_tree/versions/upload/" \
              -H "Authorization: bearer $BLENDER_EXTENSIONS_TOKEN" \
              -F "version_file=@$zip" \
              -F "release_notes=Release v${GITHUB_REF_NAME}" \
              --fail --show-error
            echo ""
          done
